name: live

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space for the repository cache
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra dense
      - uses: actions/cache@v4
        with:
          path: |
            .cache/repos
            ~/.cache/huggingface
          key: live-v2-${{ github.run_id }}
          restore-keys: live-v2-
      - name: Score last week's fixed bugs
        run: uv run python scripts/live_eval.py run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Summarize
        run: uv run python scripts/live_eval.py summary
      - name: Keep the results
        run: |
          git config user.name "allfather-live"
          git config user.email "allfather-live@users.noreply.github.com"
          git add results/live
          git diff --cached --quiet || git commit -m "Live accuracy for $(date -u +%F) [skip ci]"
          git push
      - name: Publish to the site
        run: uv run python scripts/live_eval.py summary --publish https://allfather.dev/api/live
        env:
          LIVE_TOKEN: ${{ secrets.LIVE_TOKEN }}
      - name: Keep the repository cache under 2.5 GB, least recently used dropped first
        if: always()
        run: |
          total=0
          for m in .cache/repos/*.git; do
            [ -d "$m" ] && echo "$(find "$m" -type f -printf '%T@\n' | sort -n | tail -1) $m"
          done | sort -rn | cut -d' ' -f2 | while read -r d; do
            total=$((total + $(du -sk "$d" | cut -f1)))
            if [ "$total" -gt 2500000 ]; then rm -rf "$d"; fi
          done
          du -sh .cache/repos 2>/dev/null || true
